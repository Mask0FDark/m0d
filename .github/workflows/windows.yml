name: Build Windows App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "desktop/**"
      - ".github/workflows/windows.yml"

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install
        working-directory: desktop
        run: npm install --no-audit --no-fund

      - name: Build installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run dist:win

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: M0D-Windows-x64
          path: |
            desktop/dist/*.exe
            desktop/dist/latest*.yml
          if-no-files-found: error
          retention-days: 14

      - name: Publish update
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $pkg = Get-Content desktop/package.json -Raw | ConvertFrom-Json
          $tag = "v$($pkg.version)"
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --repo $env:GITHUB_REPOSITORY --title "M0D $($pkg.version)" --notes "Автоматическая сборка M0D $($pkg.version)."
          }
          Get-ChildItem desktop/dist -File | Where-Object { $_.Extension -eq '.exe' -or $_.Name -like 'latest*.yml' } | ForEach-Object {
            gh release upload $tag $_.FullName --repo $env:GITHUB_REPOSITORY --clobber
          }

name: Build Android App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Keep Android update signing key stable
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: m0d-android-debug-keystore-v2

      - name: Ensure Android signing key
        shell: bash
        run: |
          mkdir -p "$HOME/.android"
          if [ ! -f "$HOME/.android/debug.keystore" ]; then
            keytool -genkeypair -v \
              -keystore "$HOME/.android/debug.keystore" \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -dname "CN=Android Debug,O=Android,C=US" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -storetype JKS
          fi
          keytool -list -v -keystore "$HOME/.android/debug.keystore" -storepass android -alias androiddebugkey | grep -E "SHA256:|Alias name:"

      - name: Install Android SDK 36
        shell: bash
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path "*/bin/sdkmanager" | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Sync Capacitor
        working-directory: mobile
        env:
          M0D_APP_URL: https://m0d-dev.mask-0f-darkness.ru
        run: npx cap sync android

      - name: Restore Firebase client config
        shell: bash
        env:
          M0D_GOOGLE_SERVICES_JSON: ${{ secrets.M0D_GOOGLE_SERVICES_JSON }}
        run: |
          test -n "$M0D_GOOGLE_SERVICES_JSON"
          printf '%s' "$M0D_GOOGLE_SERVICES_JSON" > mobile/android/app/google-services.json

      - name: Build APK
        working-directory: mobile/android
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease

      - name: Prepare APK
        shell: bash
        run: |
          VERSION="$(node -p "require('./mobile/package.json').version")"
          cp mobile/android/app/build/outputs/apk/release/app-release.apk "M0D-${VERSION}-android.apk"

      - name: Verify release APK identity
        shell: bash
        run: |
          VERSION="$(node -p "require('./mobile/package.json').version")"
          APK="M0D-${VERSION}-android.apk"
          AAPT="$ANDROID_HOME/build-tools/36.0.0/aapt"
          APKSIGNER="$ANDROID_HOME/build-tools/36.0.0/apksigner"

          BADGING="$("$AAPT" dump badging "$APK" | head -1)"
          echo "$BADGING"
          echo "$BADGING" | grep -F "name='site.m0d.messenger'"
          echo "$BADGING" | grep -F "versionName='${VERSION}'"
          if echo "$BADGING" | grep -Fq "versionName='${VERSION}-dev'"; then
            echo "Refusing to publish a -dev APK"
            exit 1
          fi

          CERT="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/^Signer #1 certificate SHA-256 digest: //p' | head -1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          EXPECTED="2c4743d6ae143e4c3719ecd8978dc3340f249e46ae1ac54123638a14b3e73258"
          echo "certificate_sha256=$CERT"
          test "$CERT" = "$EXPECTED"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: M0D-Android
          path: M0D-*-android.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish update
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./mobile/package.json').version")"
          TAG="v$VERSION"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "M0D $VERSION" --notes "Автоматическая сборка M0D $VERSION." --latest=false
          else
            gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --latest=false
          fi
          gh release upload "$TAG" "M0D-${VERSION}-android.apk" --repo "$GITHUB_REPOSITORY" --clobber

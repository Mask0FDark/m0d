name: Build Android App

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "mobile/**"
      - ".github/workflows/android.yml"

permissions:
  contents: write

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Keep Android update signing key stable
        uses: actions/cache@v4
        with:
          path: ~/.android/debug.keystore
          key: m0d-android-debug-keystore-v1

      - name: Install Android SDK 36
        shell: bash
        run: |
          ANDROID_HOME="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -path "*/bin/sdkmanager" | sort -V | tail -1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-36" "build-tools;36.0.0"
          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install dependencies
        working-directory: mobile
        run: npm ci

      - name: Sync Capacitor
        working-directory: mobile
        env:
          M0D_APP_URL: https://m0d-dev.mask-0f-darkness.ru
        run: npx cap sync android

      - name: Build APK
        working-directory: mobile/android
        shell: bash
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      - name: Prepare APK
        shell: bash
        run: |
          VERSION="$(node -p "require('./mobile/package.json').version")"
          cp mobile/android/app/build/outputs/apk/debug/app-debug.apk "M0D-${VERSION}-android.apk"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: M0D-Android
          path: M0D-*-android.apk
          if-no-files-found: error
          retention-days: 14

      - name: Publish update
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./mobile/package.json').version")"
          TAG="v$VERSION"
          if ! gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "M0D $VERSION" --notes "Автоматическая сборка M0D $VERSION."
          fi
          gh release upload "$TAG" "M0D-${VERSION}-android.apk" --repo "$GITHUB_REPOSITORY" --clobber
